<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Band Simulator</title>
<style>
:root{
  --bg:#eef1f4;--panel:#fbfcfd;--panel2:#e8ecf0;--ink:#1d2329;--muted:#66717c;--line:#d6dde4;
  --acc:#d9467a;--acc2:#7c5cff;--live:#0ea5e9;
  --wood:#4b4f57;--wood2:#33363c;--fretw:#b9bec7;--str:#eef0f2;--bfilter:none;
  --wkey:#ffffff;--wkey-b:#cfd6de;--bkey:#1d2329;--pad:#e3e8ee;
  color-scheme:light;
}
:root[data-song="hcts"]{--acc:#f59e0b;--acc2:#ea580c;--wood:#b97d47;--wood2:#8f5a2c;--fretw:#e6d7b8}
:root[data-song="gone2"]{--acc:#d9467a;--acc2:#7c5cff}
:root[data-song="beatit"]{--acc:#e11d48;--acc2:#991b1b;--wood:#2a2a2e;--wood2:#18181b;--fretw:#a1a1aa}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121418;--panel:#1b1e24;--panel2:#252931;--ink:#eef1f4;--muted:#9aa4af;--line:#30353e;
    --bfilter:brightness(.75);--str:#d9dce1;
    --wkey:#e6e9ee;--wkey-b:#8d96a1;--bkey:#0b0c0f;--pad:#262a32;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121418;--panel:#1b1e24;--panel2:#252931;--ink:#eef1f4;--muted:#9aa4af;--line:#30353e;
  --bfilter:brightness(.75);--str:#d9dce1;
  --wkey:#e6e9ee;--wkey-b:#8d96a1;--bkey:#0b0c0f;--pad:#262a32;color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-top:12px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{flex:none;width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center}
.brand h1{font-size:19px;margin:0;line-height:1.15}
.brand p{margin:0;color:var(--muted);font-size:13px}
.songs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}
.songs button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;cursor:pointer;text-align:left;line-height:1.2}
.songs button small{display:block;color:var(--muted);font-size:11.5px}
.songs button[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--panel));box-shadow:0 0 0 1px var(--acc)}
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-left:auto;flex:1 1 460px;justify-content:flex-end}
.big{border:0;border-radius:999px;padding:10px 20px;font-weight:650;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;cursor:pointer;box-shadow:0 2px 10px color-mix(in srgb,var(--acc2) 30%,transparent);white-space:nowrap}
.big:active{transform:translateY(1px)}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 14px;cursor:pointer}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.mini{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.mini input[type=range]{width:80px;accent-color:var(--acc2)}
.meter{width:46px;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444)}
.theme{border:1px solid var(--line);background:var(--panel);border-radius:999px;width:36px;height:36px;cursor:pointer}
.songbar{display:flex;align-items:stretch;gap:12px;padding-bottom:10px}
.chordbox{flex:none;width:92px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.chordbox b{font-size:26px}
.chordbox small{font-size:11px;color:var(--muted)}
.sections{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.strip{position:relative;display:flex;gap:2px;height:34px;border-radius:8px;overflow:hidden;cursor:pointer}
.strip button{border:0;min-width:0;padding:0 4px;font-size:11.5px;background:var(--panel2);color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.strip button.cur{background:color-mix(in srgb,var(--acc) 22%,var(--panel2));color:var(--ink);font-weight:650}
.strip .head{position:absolute;top:0;bottom:0;width:2px;background:var(--acc2);pointer-events:none;left:0;z-index:1}
.substrip{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;color:var(--muted);padding-bottom:8px}
.opts label{display:flex;align-items:center;gap:6px}
.opts input[type=range]{width:110px;accent-color:var(--acc2)}
.focusline{font-size:13px;color:var(--muted);padding-bottom:10px}
.focusline b{color:var(--ink)}
kbd{font:12px ui-monospace,Menlo,monospace;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
main{padding:14px 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;transition:border-color .15s,box-shadow .15s}
.card.focus{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}
.card.wide{grid-column:1/-1}
.card>header{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap}
.led{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--line);transition:background .08s,box-shadow .08s}
.card.sounding .led{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.card h2{font-size:16px;margin:0}
.who{margin:0;font-size:12.5px;color:var(--muted)}
.ttl{flex:1 1 200px;min-width:0}
.ctl{display:flex;gap:6px;align-items:center}
.ctl button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:3px 9px;font-size:12.5px;cursor:pointer}
.ctl button[aria-pressed="true"].mute{background:#ef4444;border-color:#ef4444;color:#fff}
.ctl button[aria-pressed="true"].solo{background:var(--acc);border-color:var(--acc);color:#fff}
.ctl input{width:74px;accent-color:var(--acc2)}
.hint{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.scroller{overflow-x:auto;overflow-y:hidden;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.extras{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:10px;font-size:13px}
.extras label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.extras input[type=range]{width:110px;accent-color:var(--acc2)}
.extras select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.chords{display:flex;flex-wrap:wrap;gap:6px}
.chords button{min-width:46px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 8px;font-weight:650;cursor:pointer}
.chords button small{display:block;font-weight:400;font-size:10px;color:var(--muted)}
.chords button.live{background:var(--live);color:#fff;border-color:var(--live)}
.chords button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.board{display:grid;background:linear-gradient(180deg,var(--wood),var(--wood2));border-radius:8px;user-select:none;-webkit-user-select:none;touch-action:pan-x;filter:var(--bfilter)}
.board.banjo{background:linear-gradient(180deg,#d9cfb8,#bfb397)}
.fc{position:relative;height:26px;border:0;background:none;padding:0;cursor:pointer;border-right:3px solid var(--fretw)}
.fc.nut{border-right:6px solid #f2f2ee}
.fc::before{content:"";position:absolute;left:0;right:-3px;top:50%;height:var(--th,1px);transform:translateY(-50%);background:var(--str);opacity:.9}
.board.banjo .fc::before{background:#55504a}
.fc::after{content:attr(data-n);position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;font-size:9.5px;line-height:20px;font-weight:700;color:#fff;text-align:center;opacity:0;transform:scale(.6);transition:opacity .06s,transform .06s;z-index:1}
.fc.on::after{opacity:1;transform:scale(1);background:var(--acc);box-shadow:0 0 10px var(--acc)}
.fc.live::after{opacity:1;transform:scale(1);background:var(--live);box-shadow:0 0 10px var(--live)}
.fc.dead{cursor:default;opacity:.25}
.fc.dead::before{opacity:0}
.fc.capoed{opacity:.35}
.fc.mark{background:radial-gradient(circle at 50% 50%,#ffffff2e 0 5px,transparent 6px)}
.fnum{display:grid;font-size:10px;color:var(--muted);text-align:center;margin-top:2px}
.fnum span.m{color:var(--ink);font-weight:700}
.kb{position:relative;height:120px;user-select:none;-webkit-user-select:none;touch-action:pan-x}
.k{position:absolute;top:0;border:1px solid var(--wkey-b);cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font-size:10px;padding-bottom:4px;color:#66717c}
.k.w{height:100%;background:var(--wkey);border-radius:0 0 6px 6px;z-index:1}
.k.b{height:62%;background:var(--bkey);border-color:var(--bkey);border-radius:0 0 4px 4px;z-index:2}
.k.w.on{background:var(--acc)}
.k.b.on{background:var(--acc2);border-color:var(--acc2)}
.k.live{background:var(--live)!important;border-color:var(--live)!important}
.pads{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.pad{aspect-ratio:1.35;border:1px solid var(--line);border-radius:12px;background:var(--pad);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:650;transition:transform .05s,background .06s;user-select:none;touch-action:manipulation;text-align:center}
.pad small{font-weight:400;color:var(--muted);font-size:11px}
.pad.on{background:var(--acc);color:#fff;transform:scale(.97)}
.pad.on small,.pad.live small{color:#fff}
.pad.live{background:var(--live);color:#fff;transform:scale(.95)}
.info{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.info section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.info h3{margin:0 0 6px;font-size:14px}
.info ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.info li{margin:3px 0}
.info li b{color:var(--ink);font-weight:600}
[hidden]{display:none!important}
@media (max-width:900px),(max-height:760px){header.top{position:static}}
@media (max-width:640px){.brand h1{font-size:17px}.transport{justify-content:flex-start}.kb{height:104px}.chordbox{width:72px}.chordbox b{font-size:21px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap row">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 16c3-9 6-9 8 0s5 9 8-2" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></div>
      <div><h1 id="title">Band Simulator</h1><p id="sub"></p></div>
    </div>
    <div class="transport">
      <button class="big" id="play">▶ Play the song</button>
      <button class="ghost" id="stop" title="Stop and rewind">■ Stop</button>
      <span class="time" id="time">0:00 / 0:00</span>
      <div class="mini">Vol <input type="range" id="mvol" min="0" max="1" step="0.01" value="0.8" aria-label="Master volume"><span class="meter"><i id="meter"></i></span></div>
      <button class="theme" id="theme" title="Toggle light/dark">◐</button>
    </div>
  </div>
  <div class="wrap songs" id="songs" role="group" aria-label="Choose a song"></div>
  <div class="wrap songbar">
    <div class="chordbox" id="chordbox"><small>chord</small><b id="chord">–</b><small id="next">next –</small></div>
    <div class="sections"><div class="strip" id="strip"></div>
      <div class="substrip"><span id="secname"></span><span id="barpos"></span></div></div>
  </div>
  <div class="wrap opts">
    <label>Tempo <input type="range" id="tempo" min="0.6" max="1.3" step="0.01" value="1"> <span id="bpm"></span></label>
    <label id="downwrap"><input type="checkbox" id="down" checked> Tuned ½ step down (as on the record)</label>
  </div>
  <div class="wrap focusline" id="focusline"></div>
</header>
<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="info" id="info"></div>
</main>

let ctx=null,master,analyser,mix,reverb,noiseBuf;

function initAudio(){
  if(ctx){if(ctx.state!=='running')ctx.resume();return}
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;
  master=ctx.createGain();master.gain.value=+$('#mvol').value;
  analyser=ctx.createAnalyser();analyser.fftSize=512;
  const lim=ctx.createDynamicsCompressor();lim.threshold.value=-1.5;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=0.001;lim.release.value=0.12;
  mix=ctx.createGain();mix.connect(comp);comp.connect(analyser);analyser.connect(master);master.connect(lim);lim.connect(ctx.destination);
  reverb=ctx.createConvolver();reverb.buffer=makeIR(2.5);
  const ret=ctx.createGain();ret.gain.value=0.3;reverb.connect(ret);ret.connect(mix);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  buildBuses();
}
function makeIR(sec){
  const n=Math.floor(ctx.sampleRate*sec),b=ctx.createBuffer(2,n,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.1)}

}
function driveCurve(k){const n=2048,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(k*x)/Math.tanh(k)}return c}
function buildBuses(){
  if(!ctx)return;
  Object.values(bus).forEach(g=>g.disconnect());Object.values(inp).forEach(g=>g.disconnect());
  bus={};inp={};
  song.insts.forEach(i=>{
    const g=ctx.createGain(),s=ctx.createGain();s.gain.value=i.rev;
    if(i.pan){const pn=ctx.createStereoPanner();pn.pan.value=i.pan;g.connect(pn).connect(mix)}else g.connect(mix);g.connect(s);s.connect(reverb);bus[i.id]=g;

      const pre=ctx.createGain();pre.gain.value=1;const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=110;
      const sh=ctx.createWaveShaper();sh.curve=driveCurve(i.drive);sh.oversample='2x';
      const cab=ctx.createBiquadFilter();cab.type='lowpass';cab.frequency.value=4200;cab.Q.value=0.9;

      pre.connect(hp).connect(sh).connect(mid).connect(cab).connect(post).connect(g);inp[i.id]=pre;

function applyMix(now){
  if(!ctx)return;
  const anySolo=song.insts.some(i=>state[i.id].solo);
  song.insts.forEach(i=>{const s=state[i.id],on=anySolo?s.solo:!s.mute,v=on?i.gain*s.vol:0;

const KS={
  gtr:{len:2.6,decay:.9985,bright:.55,lp:5200,ring:.55},
  hbass:{len:3.2,decay:.9975,bright:.22,lp:1300,ring:.06},
  egtr:{len:2.6,decay:.9986,bright:.72,lp:3600,ring:.5},
  egtr2:{len:2.8,decay:.9988,bright:.8,lp:4200,ring:.9},
  banjo:{len:1.6,decay:.9935,bright:.95,lp:6500,hp:260,ring:.3},
  riff:{len:1.6,decay:.9975,bright:.85,lp:6000,ring:.05},
  lead:{len:4,decay:.99945,bright:.9,lp:7000,ring:.12},
  fbass:{len:2.6,decay:.997,bright:.3,lp:1900,ring:.04},
};
function ks(p,kind){
  const key=kind+p;if(ksCache[key])return ksCache[key];
  const P=KS[kind],sr=ctx.sampleRate,f=mtof(p),N=Math.max(2,Math.round(sr/f-0.5)),actual=sr/(N+0.5);
  const n=Math.floor(sr*P.len),buf=ctx.createBuffer(1,n,sr),d=buf.getChannelData(0);
  let prev=0,mean=0,peak=0;
  for(let i=0;i<N;i++){prev+=P.bright*((Math.random()*2-1)-prev);d[i]=prev;mean+=prev}
  mean/=N;for(let i=0;i<N;i++){d[i]-=mean;peak=Math.max(peak,Math.abs(d[i]))}
  for(let i=0;i<N;i++)d[i]/=peak||1;
  for(let i=N;i<n;i++)d[i]=P.decay*0.5*(d[i-N]+(i-N-1>=0?d[i-N-1]:0));
  return ksCache[key]={buf,rate:f/actual};
}

function applyBend(param,base,t,bend,toVal){
  param.setValueAtTime(toVal(base,bend[1]),t);

    l.innerHTML=`Capo <select>${[0,1,2,3,4,5,6,7].map(n=>`<option value="${n}"${n===capo?' selected':''}>${n?'fret '+n:'none'}</option>`).join('')}</select>`;
    l.querySelector('select').onchange=e=>{capo=+e.target.value;markCapo()};ex.appendChild(l);
    const markCapo=()=>Object.values(cells).forEach(c=>c.classList.toggle('capoed',+c.dataset.f>0&&+c.dataset.f<capo));markCapo();
  }
}
function chordBtn(inst,i){
  initAudio();const v=view[inst.id],t0=ctx.currentTime+0.005,tr=TR();
  if(inst.chords){const c=inst.capo?capo:0;let k=0;
    inst.chords[i][1].forEach((f,s)=>{if(f<0)return;inst.voice(inp[inst.id],inst.open[s]+f+c+tr,96-k*4,t0+k*0.016,1.4);k++;flash(v.cells[s+','+(f+c)],380)})}
  else{const bv=banjoVoicing(inst.rolls[i]),seq=[bv[2],bv[3],bv[4],bv[0],bv[3],bv[4],bv[1],bv[3]],st=0.5*G2_SPB/speed;
    seq.forEach((p,k)=>{inst.voice(inp[inst.id],p+tr,k%2?72:88,t0+k*st,0.9);setTimeout(()=>v.mapMany([p]).forEach(el=>flash(el,200)),k*st*1000)})}
  flash(v.chordBtns[i],200);
}
const PAD_KEYS='zxcvbnm,.';
function buildPads(inst,surf,v,hint){
  const g=document.createElement('div');g.className='pads';const els={};
  inst.pads.forEach(([p,name],i)=>{const b=document.createElement('button');b.className='pad';b.innerHTML=`${name}<small>${PAD_KEYS[i].toUpperCase()}</small>`;
    b.addEventListener('pointerdown',e=>{e.preventDefault();live(inst,p,110);flash(b,120)});g.appendChild(b);els[p]=b});
  // song notes that use a neighbouring sound light the closest pad
  const alias={35:36,36:35,40:38,37:38,44:42,50:48,45:48,47:48,43:41,57:49,55:49,52:49,51:49,59:49,28:39,69:42,54:42};
  v.map=p=>{let e=els[p];if(!e&&alias[p]!=null)e=els[alias[p]];if(!e&&alias[alias[p]]!=null)e=els[alias[alias[p]]];return e?[e]:[]};
  v.pads=els;surf.parentNode.replaceWith(surf);surf.appendChild(g);
  hint.innerHTML='Tap the pads, or use '+inst.pads.map((_,i)=>`<kbd>${PAD_KEYS[i].toUpperCase()}</kbd>`).join(' ')+' any time.';
}
function setFocus(id){
  focused=id;song.insts.forEach(i=>view[i.id].card.classList.toggle('focus',i.id===id));
  const i=song.insts.find(x=>x.id===id),dr=song.insts.find(x=>x.ui==='drums');
  const dk=`<kbd>Z</kbd>…<kbd>${PAD_KEYS[dr.pads.length-1].toUpperCase()}</kbd>`;
  if(i.ui==='drums'){$('#focusline').innerHTML=`Keyboard → <b>Drums</b>: ${dk} hit the pads. Click another instrument to play it from your keyboard.`;return}
  const base=i.base+12*(octave[id]||0),nc=(i.chords||i.rolls||[]).length;
  $('#focusline').innerHTML=`Keyboard → <b>${i.name}</b>: <kbd>A</kbd> <kbd>W</kbd> <kbd>S</kbd>…<kbd>L</kbd> play from ${nn(base)} · <kbd>[</kbd> <kbd>]</kbd> octave${nc?` · <kbd>1</kbd>–<kbd>${nc}</kbd> chords`:''} · ${dk} drums · <kbd>Space</kbd> play/pause`;
}

/* ================= song switching ================= */
let stripHead,lastChordEl=null;
function loadSong(id){
  if(song){stopSong()}
  song=SONGS.find(s=>s.id===id)||SONGS[0];
  try{history.replaceState(null,'','#'+song.id)}catch(e){}
  document.documentElement.dataset.song=song.id;
  document.title=song.title+' · Band Simulator';
  $('#title').textContent=song.title+' — Band Simulator';$('#sub').innerHTML=song.sub;
  [...$('#songs').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===song.id));
  state={};view={};octave={};lastChordEl=null;pos=0;
  song.insts.forEach(i=>state[i.id]={mute:false,solo:false,vol:1});
  $('#grid').innerHTML='';song.insts.forEach(i=>$('#grid').appendChild(buildCard(i)));
  $('#info').innerHTML=song.info;
  $('#chordbox').hidden=!song.chords;$('#downwrap').hidden=!song.tuneDown;
  const strip=$('#strip');strip.innerHTML='';
  song.sections.forEach(([name,start],k)=>{const end=k+1<song.sections.length?song.sections[k+1][1]:song.length;
    const b=document.createElement('button');b.textContent=name;b.style.flex=(end-start)+' 1 0';b.title=name;
    b.onclick=e=>{e.stopPropagation();pause();play(start)};strip.appendChild(b)});
  stripHead=document.createElement('div');stripHead.className='head';strip.appendChild(stripHead);
  setFocus(song.insts[0].id);showBpm();buildBuses();updateButtons();
}
SONGS.forEach(s=>{const b=document.createElement('button');b.dataset.id=s.id;b.innerHTML=`${s.title}<small>${s.artist}</small>`;
  b.onclick=()=>loadSong(s.id);$('#songs').appendChild(b)});

/* ================= computer keyboard ================= */
const KEYS="awsedftgyhujkolp;'";
const heldKeys={};
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
  if(e.target.closest&&e.target.closest('input,select,textarea'))return;
  const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();playing?pause():play();return}
  const dr=song.insts.find(x=>x.ui==='drums'),pi=PAD_KEYS.indexOf(k);
  if(pi>=0&&pi<dr.pads.length){const p=dr.pads[pi][0];live(dr,p,110);flash(view[dr.id].pads[p],120);return}
  const inst=song.insts.find(x=>x.id===focused),nc=(inst.chords||inst.rolls||[]).length;
  if(nc&&k>='1'&&k<=String(nc)){chordBtn(inst,+k-1);return}
  if(k==='['||k===']'){octave[focused]=Math.max(-3,Math.min(3,(octave[focused]||0)+(k===']'?1:-1)));setFocus(focused);return}
  const idx=KEYS.indexOf(k);if(idx<0||inst.base==null)return;
  const p=inst.base+12*(octave[focused]||0)+idx,v=view[focused],els=v.map?v.map(p):v.mapMany([p]);
  heldKeys[k]={inst,h:live(inst,p),els};els.forEach(x=>x.classList.add('live'));
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase(),x=heldKeys[k];if(!x)return;
  x.h.stop();setTimeout(()=>x.els.forEach(el=>el.classList.remove('live')),x.inst.plucky?160:0);delete heldKeys[k];
});

/* ================= visuals ================= */
const meterEl=$('#meter');let meterBuf=null;
function frame(){
  const t=songTime();
  song.insts.forEach(i=>{
    const v=view[i.id],a=song.notes[i.id],ps=[];
    if(playing){const minLen=i.ui==='drums'?0.1:0.2;
      for(let k=Math.min(ptr[i.id],a.length)-1;k>=0;k--){const n=a[k];if(n[0]>t)continue;if(t-n[0]>8)break;
        if(t<n[0]+Math.max(i.ui==='drums'?0:n[1],minLen))ps.push(n[2])}}
    const els=new Set(v.map?ps.flatMap(v.map):v.mapMany(ps));
    v.lit.forEach(el=>{if(!els.has(el))el.classList.remove('on')});
    els.forEach(el=>{if(!v.lit.has(el))el.classList.add('on')});
    v.lit=els;v.card.classList.toggle('sounding',ps.length>0);
  });
  const secs=song.sections;let si=0;for(let k=0;k<secs.length;k++)if(t>=secs[k][1])si=k;
  [...$('#strip').querySelectorAll('button')].forEach((b,k)=>b.classList.toggle('cur',k===si));
  $('#secname').textContent=secs[si][0];
  stripHead.style.left=Math.min(100,t/song.length*100)+'%';
  if(song.chords){
    const cs=song.chords;let ci=cs.findIndex(c=>t>=c.start&&t<c.end);if(ci<0)ci=t<cs[0].start?0:cs.length-1;
    $('#chord').textContent=pretty(cs[ci].name);$('#next').textContent=cs[ci+1]?'next '+pretty(cs[ci+1].name):'end';
    $('#barpos').textContent=`bar ${Math.min(Math.floor(t/song.barSec)+1,G2.bars)} / ${G2.bars}`;
    const gi=song.insts[0].chords.findIndex(c=>c[0].replace('♭','b')===cs[ci].name);
    const el=playing&&gi>=0?view[song.insts[0].id].chordBtns[gi]:null;
    if(el!==lastChordEl){lastChordEl&&lastChordEl.classList.remove('on');el&&el.classList.add('on');lastChordEl=el}
  }else $('#barpos').textContent='';
  $('#time').textContent=fmt(t/speed)+' / '+fmt(song.length/speed);
  if(analyser){meterBuf=meterBuf||new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(meterBuf);
    let pk=0;for(const x of meterBuf)pk=Math.max(pk,Math.abs(x));meterEl.style.width=Math.min(100,pk*110)+'%'}
  requestAnimationFrame(frame);
}
$('#strip').addEventListener('click',e=>{const r=$('#strip').getBoundingClientRect();pause();play((e.clientX-r.left)/r.width*song.length)});
loadSong((location.hash||'').slice(1));
requestAnimationFrame(frame);
</script>
